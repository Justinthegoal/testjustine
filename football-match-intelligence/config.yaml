provider:
  base_url: https://v3.football.api-sports.io
  timeout_seconds: 30
  max_retries: 3

automation:
  pre_match_hours: 6
  post_match_delay_minutes: 20
  lookback_days: 2
  days_ahead: 3
  timezone: Europe/Madrid
  # Empty = all competitions returned by the provider for the requested dates.
  # To limit coverage, list API-Football league IDs, e.g. [2, 3, 39, 140, 135, 78, 61].
  competitions: []

analysis:
  recent_matches: 5
  head_to_head_matches: 5
  poisson_max_goals: 10
  smoothing_goals: 0.15

reports:
  output_dir: reports
  language: en
